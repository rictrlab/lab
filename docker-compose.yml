version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./problems:/app/problems
      - ./backend/app.db:/app/app.db
    environment:
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - CUDA_VISIBLE_DEVICES=
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    restart: unless-stopped
