# Railway config-as-code — auto-detected on deploy from this repo.
# Railway injects $PORT at runtime; the root Dockerfile already honors it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
